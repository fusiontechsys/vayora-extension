name: Build Sentinel APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Create signing keystore (only if you have not committed one)
        run: |
          mkdir -p keystore
          if [ ! -f keystore/vayora.jks ]; then
            keytool -genkeypair -v -keystore keystore/vayora.jks -storetype JKS \
              -alias vayora -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass vayora123 -keypass vayora123 \
              -dname "CN=Sentinel, OU=Vayora, O=Vayora, C=IN"
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Sentinel.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sentinel-APK
          path: Sentinel.apk
