name: Unpack zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          unzip -o sentinel-rebrand-signed.zip -x ".github/*"
          rm sentinel-rebrand-signed.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply Sentinel rebrand and signing key"
          git push
